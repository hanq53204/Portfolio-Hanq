<!doctype html>
<html lang="vi" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nguyen Quang Ha | System &amp; Infrastructure Security</title>
    <meta
      name="description"
      content="Portfolio cá nhân của Nguyen Quang Ha — System Engineering, Infrastructure Security, Monitoring & SecOps."
    />
    <meta name="author" content="Nguyen Quang Ha" />
    <meta name="theme-color" content="#0D1117" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F8FA" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://portfolio-hanq-two.vercel.app/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nguyen Quang Ha Portfolio" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://portfolio-hanq-two.vercel.app/" />
    <meta property="og:title" content="Nguyen Quang Ha | System &amp; Infrastructure Security" />
    <meta
      property="og:description"
      content="Portfolio cá nhân của Nguyen Quang Ha — System Engineering, Infrastructure Security, Monitoring & SecOps."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Nguyen Quang Ha | System &amp; Infrastructure Security" />
    <meta
      name="twitter:description"
      content="Portfolio cá nhân của Nguyen Quang Ha — System Engineering, Infrastructure Security, Monitoring & SecOps."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('portfolio-theme');
          var theme = savedTheme === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          var savedLang = localStorage.getItem('portfolio-lang');
          if (savedLang === 'en' || savedLang === 'vi') {
            root.lang = savedLang;
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-blue-600/15 selection:text-blue-700 dark:selection:bg-blue-500/30 dark:selection:text-blue-200 bg-[#F6F8FA] dark:bg-[#0D1117] text-[#1F2328] dark:text-[#F0F6FC]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
